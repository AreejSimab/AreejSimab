<svg xmlns="http://www.w3.org/2000/svg" width="420" height="230" viewBox="0 0 420 230" role="img" aria-label="ABC Supermarket Website project card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#112a2a"/>
      <stop offset="1" stop-color="#0b1717"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C9A7"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
  </defs>

  <rect x="1.5" y="1.5" width="417" height="227" rx="18" fill="url(#bg)" stroke="url(#edge)" stroke-width="2"/>
  <circle cx="380" cy="30" r="70" fill="#00C9A7" opacity="0.06"/>

  <!-- category -->
  <rect x="24" y="22" width="150" height="22" rx="11" fill="#00C9A7" opacity="0.16"/>
  <text x="99" y="37" text-anchor="middle" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#00C9A7">WEB DEVELOPMENT</text>

  <!-- icon: shopping cart -->
  <g transform="translate(332,22)">
    <rect width="64" height="56" rx="12" fill="#ffffff" opacity="0.05"/>
    <path d="M14 14 h6 l5 20 h20 l5 -14 h-28" fill="none" stroke="#00C9A7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="28" cy="42" r="3.5" fill="#00C9A7"/>
    <circle cx="43" cy="42" r="3.5" fill="#00C9A7"/>
  </g>

  <!-- title -->
  <text x="24" y="82" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">ABC Supermarket Website</text>

  <!-- description -->
  <text font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="13" fill="#b5d3cd">
    <tspan x="24" y="108">Front-end e-commerce website for a</tspan>
    <tspan x="24" y="128">supermarket.</tspan>
  </text>

  <!-- tech pills -->
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    <rect x="24" y="144" width="62" height="24" rx="12" fill="none" stroke="#E34F26" stroke-width="1.5"/>
    <text x="55" y="160" fill="#E34F26">HTML5</text>
    <rect x="94" y="144" width="58" height="24" rx="12" fill="none" stroke="#2D9CDB" stroke-width="1.5"/>
    <text x="123" y="160" fill="#2D9CDB">CSS3</text>
    <rect x="160" y="144" width="92" height="24" rx="12" fill="none" stroke="#F7DF1E" stroke-width="1.5"/>
    <text x="206" y="160" fill="#F7DF1E">JavaScript</text>
  </g>

  <!-- divider -->
  <line x1="24" y1="184" x2="396" y2="184" stroke="#ffffff" opacity="0.08"/>

  <!-- status -->
  <circle cx="34" cy="206" r="5" fill="#F5A623">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="48" y="210" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="12" fill="#b5d3cd">Repository coming soon</text>
</svg>
