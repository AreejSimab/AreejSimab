<svg xmlns="http://www.w3.org/2000/svg" width="420" height="230" viewBox="0 0 420 230" role="img" aria-label="Retail Analytics Dashboard project card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1d3a"/>
      <stop offset="1" stop-color="#12111f"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C9A7"/>
      <stop offset="1" stop-color="#6C63FF"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00C9A7"/>
      <stop offset="1" stop-color="#6C63FF"/>
    </linearGradient>
  </defs>

  <rect x="1.5" y="1.5" width="417" height="227" rx="18" fill="url(#bg)" stroke="url(#edge)" stroke-width="2"/>
  <circle cx="380" cy="30" r="70" fill="#00C9A7" opacity="0.06"/>

  <!-- category -->
  <rect x="24" y="22" width="118" height="22" rx="11" fill="#00C9A7" opacity="0.16"/>
  <text x="83" y="37" text-anchor="middle" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#00C9A7">ANALYTICS &amp; BI</text>

  <!-- icon: bar chart -->
  <g transform="translate(332,22)">
    <rect width="64" height="56" rx="12" fill="#ffffff" opacity="0.05"/>
    <rect x="12" y="30" width="9" height="16" rx="2" fill="url(#bar)"/>
    <rect x="27" y="18" width="9" height="28" rx="2" fill="url(#bar)"/>
    <rect x="42" y="9" width="9" height="37" rx="2" fill="url(#bar)"/>
  </g>

  <!-- title -->
  <text x="24" y="82" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Retail Analytics Dashboard</text>

  <!-- description -->
  <text font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="13" fill="#b8b6d6">
    <tspan x="24" y="108">Turns sales and inventory data into</tspan>
    <tspan x="24" y="128">insights in an interactive dashboard.</tspan>
  </text>

  <!-- tech pill -->
  <rect x="24" y="144" width="74" height="24" rx="12" fill="none" stroke="#F2C811" stroke-width="1.5"/>
  <text x="61" y="160" text-anchor="middle" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#F2C811">Power BI</text>

  <!-- divider -->
  <line x1="24" y1="184" x2="396" y2="184" stroke="#ffffff" opacity="0.08"/>

  <!-- status -->
  <circle cx="34" cy="206" r="5" fill="#F5A623">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="48" y="210" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="12" fill="#b8b6d6">Repository coming soon</text>
</svg>
